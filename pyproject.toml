[project]
name = "atisim"
version = "1.1.0"
description = "Six-degree-of-freedom fixed-wing flight dynamics in JAX, for studying aircraft response to clear-air turbulence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mateusz Wozniak" }]
requires-python = ">=3.10"
dependencies = ["jax", "numpy", "scipy", "matplotlib"]
keywords = ["flight dynamics", "6-DOF", "JAX", "turbulence", "aircraft", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MatusGib/AtiSim"
Documentation = "https://matusgib.github.io/AtiSim/"
Changelog = "https://github.com/MatusGib/AtiSim/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Test suite and notebooks.
dev = ["pytest", "pymupdf", "jupyter", "nbval"]
# Run artifacts and the Dash analysis app. Kept out of the runtime dependencies:
# the simulator and every script work without it, and pyarrow alone is large.
ui = ["dash", "plotly", "pyarrow"]
# JSBSim, needed only to REGENERATE the frozen cross-code reference data in
# atisim/tests/data/. The test suite reads the frozen XML and never imports it.
ref = ["jsbsim"]
# The documentation site.
docs = ["sphinx>=7", "myst-parser>=2", "furo"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atisim*"]

[tool.setuptools.package-data]
atisim = ["data/*.csv", "data/cr2144_dig/*.dig", "data/cr2144_trace/*.csv", "tests/data/*.xml"]

[tool.pytest.ini_options]
# The notebooks are a separate gate (`pytest --nbval-lax notebooks/`): putting
# --nbval-lax here would break every run where nbval is not installed.
testpaths = ["atisim/tests"]
