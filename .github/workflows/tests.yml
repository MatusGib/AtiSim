name: tests

# The full test suite, then the executed notebooks, on a clean Linux runner.
# Runs on pull requests and on main: the suite takes about half an hour and the
# notebooks re-run real flights. JSBSim is not installed -- the suite reads the
# frozen reference XML in atisim/tests/data/.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # OpenBLAS picks its kernels by CPU at runtime, and GitHub's runners are a
      # mix: some expose AVX-512 and some do not. The two kernel families round
      # differently, which moves test_verification.py's bit-exact rollout pin.
      # Holding OpenBLAS to its AVX2 (Haswell) kernels makes every runner
      # reproduce the pinned bits; it loosens nothing.
      OPENBLAS_CORETYPE: Haswell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the package with the test and analysis extras
        run: python -m pip install -e .[dev,ui]
      - name: Confirm which tree is under test
        run: python -c "import atisim; print(atisim.__file__)"
      - name: Record the runner's CPU
        run: |
          lscpu | grep "Model name"
          if grep -q avx512f /proc/cpuinfo; then echo "AVX-512: yes"; else echo "AVX-512: no"; fi
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider --durations=15
      - name: Executed notebooks
        run: python -m pytest --nbval-lax notebooks/ -q -p no:cacheprovider
