name: tests

# The full test suite, then the executed notebooks, on a clean Linux runner.
# Runs on pull requests and on main rather than on every push: the suite takes
# the better part of half an hour, and the notebooks re-run real flights.
# JSBSim is not installed -- the suite reads the frozen reference XML and never
# imports it (pyproject.toml, the `ref` extra).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # OpenBLAS picks its kernels by CPU at runtime, and GitHub's runners are a
      # mix: some expose AVX-512 and some do not. On the AVX-512 hosts the two
      # families round differently, and test_verification.py's bit-exact rollout
      # pin moves. Measured on ten runners: with OpenBLAS held to its AVX2
      # (Haswell) kernels, every host reproduces the pinned bits. This makes
      # every runner the environment the pin was captured in; it loosens nothing.
      # docs/PROJECT.md section 4, "What does not reproduce on another platform".
      OPENBLAS_CORETYPE: Haswell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the package with the test and analysis extras
        run: python -m pip install -e .[dev,ui]
      - name: Confirm which tree is under test
        run: python -c "import atisim; print(atisim.__file__)"
      - name: Record the runner's CPU
        run: |
          lscpu | grep "Model name"
          if grep -q avx512f /proc/cpuinfo; then echo "AVX-512: yes"; else echo "AVX-512: no"; fi
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider --durations=15
      - name: Executed notebooks
        run: python -m pytest --nbval-lax notebooks/ -q -p no:cacheprovider
