name: docs

# Builds the documentation site on every push and pull request, with warnings
# treated as errors, so a docstring or a record edit that breaks the site fails
# here rather than on release day. Deploys to GitHub Pages from `main` -- but
# only while the repository is PUBLIC: Pages cannot publish from a private
# repository on a free plan, and the deploy switches itself on at release
# without this file being edited. Enable Pages once, with its source set to
# "GitHub Actions" (Settings > Pages).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the package and the docs toolchain
        run: python -m pip install -e .[docs]
      - name: Build, failing on any warning
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event.repository.private == false
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
